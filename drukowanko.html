<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kocham cie</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --accent: #6366f1;
            --accent-hover: #000000;
            --text: #1f2937;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); color: var(--text);
            margin: 0; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container { 
            background: white; padding: 30px; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            max-width: 900px; width: 100%;
        }

        header { margin-bottom: 30px; }
        h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; }
        p { color: #6b7280; margin: 5px 0 0; }

        .settings-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; margin-bottom: 30px; padding: 20px;
            background: #f8fafc; border-radius: 12px;
        }

        .input-box label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #4b5563; }
        input { 
            width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; 
            font-size: 15px; transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--accent); ring: 2px solid #b163f133; }

        #preview-area { 
            margin-top: 30px; padding: 20px; background: #333; border-radius: 12px;
            display: none; justify-content: center; overflow: auto;
        }

        .grid-preview {
            display: grid; position: relative; border: 1px solid #555;
        }

        .grid-cell {
            border: 1px solid rgba(255,255,255,0.2);
            position: relative; box-sizing: border-box;
            /* Symulacja marginesu drukarki */
            box-shadow: inset 0 0 0 10px rgba(255,255,255,0.1);
        }

        .grid-cell::before {
            content: attr(data-page);
            position: absolute; top: 5px; left: 5px;
            font-size: 10px; color: white; background: rgba(0,0,0,0.5);
            padding: 2px 6px; border-radius: 4px;
        }

        .actions { display: flex; gap: 15px; margin-top: 20px; }

        button { 
            flex: 1; padding: 14px; border: none; border-radius: 10px; 
            font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 16px;
        }

        .btn-blue { background: var(--accent); color: white; }
        .btn-blue:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-green { background: #10b981; color: white; display: none; }
        .btn-green:hover { background: #059669; }

        @media print {
            .container { display: none; }
            #print-container { display: block !important; }
            .page-break { page-break-after: always; width: 210mm; height: 297mm; overflow: hidden; }
            canvas { width: 210mm; height: 297mm; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>:3333333</h1>
        <p>Kocham cię skarbie</p>
    </header>

    <div class="settings-grid">
        <div class="input-box" style="grid-column: 1 / -1;">
            <label>Wybierz zdjęcie</label>
            <input type="file" id="upload" accept="image/*">
        </div>
        <div class="input-box">
            <label>Szerokość (cm)</label>
            <input type="number" id="targetW" value="60">
        </div>
        <div class="input-box">
            <label>Wysokość (cm)</label>
            <input type="number" id="targetH" value="80">
        </div>
    </div>

    <div class="actions">
        <button class="btn-blue" onclick="updatePreview()">Podgląd</button>
        <button id="printBtn" class="btn-green" onclick="startPrint()">Drukuj</button>
    </div>

    <div id="preview-area">
        <div id="grid-display" class="grid-preview"></div>
    </div>
</div>

<div id="print-container"></div>

<script>
    let imgObj = null;

    document.getElementById('upload').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            imgObj = new Image();
            imgObj.onload = updatePreview;
            imgObj.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function updatePreview() {
        if (!imgObj) return alert("Kochanie, musisz najpierw załączyć zdjęcie");

        const w = parseFloat(document.getElementById('targetW').value);
        const h = parseFloat(document.getElementById('targetH').value);
        
        // Obliczenia (zakładka 10mm)
        const cols = Math.ceil((w * 10) / 200); 
        const rows = Math.ceil((h * 10) / 287);

        const previewArea = document.getElementById('preview-area');
        const grid = document.getElementById('grid-display');
        
        previewArea.style.display = 'flex';
        grid.innerHTML = '';
        grid.style.backgroundImage = `url(${imgObj.src})`;
        grid.style.backgroundSize = '100% 100%';
        
        // Skalowanie podglądu do okna
        const maxDisplayWidth = 800;
        const scale = maxDisplayWidth / w;
        grid.style.width = (w * scale) + 'px';
        grid.style.height = (h * scale) + 'px';
        
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

        for (let i = 1; i <= (cols * rows); i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.setAttribute('data-page', i);
            grid.appendChild(cell);
        }

        document.getElementById('printBtn').style.display = 'block';
    }

    function startPrint() {
        const w = parseFloat(document.getElementById('targetW').value);
        const h = parseFloat(document.getElementById('targetH').value);
        const overlapMm = 10;
        const container = document.getElementById('print-container');
        container.innerHTML = '';

        const effW = 210 - overlapMm;
        const effH = 297 - overlapMm;
        const cols = Math.ceil((w * 10) / effW);
        const rows = Math.ceil((h * 10) / effH);
        
        const pxPerMmW = imgObj.width / (w * 10);
        const pxPerMmH = imgObj.height / (h * 10);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const page = document.createElement('div');
                page.className = 'page-break';
                const canvas = document.createElement('canvas');
                canvas.width = 2480; canvas.height = 3508;
                const ctx = canvas.getContext('2d');

                // Rysowanie z uwzględnieniem overlapu
                ctx.drawImage(
                    imgObj, 
                    c * effW * pxPerMmW, r * effH * pxPerMmH, 210 * pxPerMmW, 297 * pxPerMmH, 
                    0, 0, 2480, 3508
                );
                page.appendChild(canvas);
                container.appendChild(page);
            }
        }
        window.print();
    }
</script>

</body>
</html>
